[project]
name = "booktime-backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "BlazEffect", email = "kamalinigor@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "embeddify>=0.4.0",
    "fastapi[standard]>=0.142.2",
    "passlib[argon2]>=1.7.4",
